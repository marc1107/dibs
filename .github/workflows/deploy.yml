name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
      - name: Smoke test production
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "$APP_URL/api/health" | grep -q '"ok":true'; then break; fi
            sleep 5
          done
          curl -fsS "$APP_URL/api/health" | grep -q '"ok":true'
          curl -fsS -o /dev/null "$APP_URL/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/bookings?from=2026-01-01T00:00:00Z&to=2026-02-01T00:00:00Z")" = "401"
