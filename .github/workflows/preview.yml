name: preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Runs once Cloudflare is set up (repository variable CLOUDFLARE_CONFIGURED=true, see docs/SETUP.md).
    # Secrets are not available to Dependabot and fork PRs.
    if: >-
      vars.CLOUDFLARE_CONFIGURED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply migrations to the preview database
        run: pnpm exec wrangler d1 migrations apply DB --remote --env preview
      # `versions upload` needs an existing Worker; the first preview run creates it.
      - name: Ensure the preview Worker exists
        run: pnpm exec wrangler deployments list >/dev/null 2>&1 || pnpm exec wrangler deploy
      - name: Upload preview version
        id: upload
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -Eo 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview link
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = "<!-- preview-link -->";
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nSeparate preview database, no production data. Google sign-in only works on URLs registered in the Google OAuth client.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
